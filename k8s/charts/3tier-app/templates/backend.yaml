apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "3tier-app.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: 3tier-backend
  template:
    metadata:
      labels:
        app: 3tier-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: {{ .Values.backend.env.DB_HOST }}
            - name: DB_NAME
              value: {{ .Values.backend.env.DB_NAME }}
            - name: DB_USER
              value: {{ .Values.backend.env.DB_USER }}
            - name: DB_PASSWORD
              value: {{ .Values.backend.env.DB_PASSWORD }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: 3tier-backend
